<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TSA Web - Checkout</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#070914;
    color:#fff;
    min-height:100vh;
}

.navbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 6%;
    background:#080b18;
    border-bottom:1px solid #252b4a;
}

.logo{
    font-size:26px;
    font-weight:900;
    color:#8b5cf6;
}

.logo span{
    color:#38bdf8;
}

.back{
    color:#cbd5e1;
    text-decoration:none;
    padding:10px 16px;
    border:1px solid #334155;
    border-radius:9px;
}

.back:hover{
    color:#38bdf8;
    border-color:#38bdf8;
}

.container{
    width:92%;
    max-width:1050px;
    margin:45px auto 80px;
}

.header{
    margin-bottom:30px;
}

.header h1{
    font-size:35px;
    margin-bottom:8px;
}

.header p{
    color:#94a3b8;
}

.checkout{
    display:grid;
    grid-template-columns:1.3fr .8fr;
    gap:22px;
}

.card{
    padding:28px;
    border-radius:17px;
    background:linear-gradient(145deg,#11172b,#0b1020);
    border:1px solid #27304e;
}

.card h2{
    margin-bottom:22px;
}

.group{
    margin-bottom:18px;
}

label{
    display:block;
    color:#cbd5e1;
    font-size:14px;
    margin-bottom:8px;
}

input,
select{
    width:100%;
    padding:14px;
    border-radius:9px;
    border:1px solid #334155;
    outline:none;
    background:#080d1c;
    color:#fff;
}

input:focus,
select:focus{
    border-color:#6366f1;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.payment{
    padding:15px;
    border:1px solid #27304e;
    border-radius:10px;
    margin-bottom:10px;
    cursor:pointer;
}

.payment:hover{
    border-color:#6366f1;
}

.payment input{
    width:auto;
    margin-right:8px;
}

.summary-item{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    color:#94a3b8;
    border-bottom:1px solid #202a47;
}

.total{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}

.total span:last-child{
    color:#a78bfa;
}

.pay{
    width:100%;
    padding:14px;
    margin-top:24px;
    border:0;
    border-radius:10px;
    color:#fff;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
}

.pay:hover{
    transform:translateY(-2px);
}

.secure{
    text-align:center;
    margin-top:15px;
    color:#64748b;
    font-size:12px;
}

#message{
    display:none;
    margin-top:18px;
    padding:13px;
    border-radius:9px;
    background:#101a32;
    color:#93c5fd;
    text-align:center;
}

footer{
    text-align:center;
    padding:30px;
    color:#64748b;
    background:#050711;
    border-top:1px solid #1c2338;
}

@media(max-width:800px){

    .checkout{
        grid-template-columns:1fr;
    }

    .row{
        grid-template-columns:1fr;
    }

    .navbar{
        padding:16px 5%;
    }
}
</style>
</head>

<body>

<header class="navbar">

    <div class="logo">
        TSA <span>Web</span>
    </div>

    <a href="pricing.html" class="back">
        ← Plans
    </a>

</header>


<div class="container">

    <div class="header">

        <h1>
            Checkout
        </h1>

        <p>
            Apni service details confirm karke order continue karein.
        </p>

    </div>


    <form id="checkoutForm">

        <div class="checkout">


            <!-- CUSTOMER DETAILS -->

            <section class="card">

                <h2>
                    Customer Details
                </h2>


                <div class="row">

                    <div class="group">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <div class="group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <div class="group">

                    <label>
                        Select Service
                    </label>

                    <select id="service" required>

                        <option value="">
                            Select a service
                        </option>

                        <option value="Game Hosting">
                            Game Hosting
                        </option>

                        <option value="Bot Hosting">
                            Bot Hosting
                        </option>

                        <option value="VPS Hosting">
                            VPS Hosting
                        </option>

                        <option value="PaaS">
                            PaaS
                        </option>

                    </select>

                </div>


                <h2 style="margin-top:25px;">
                    Payment Method
                </h2>


                <label class="payment">

                    <input
                        type="radio"
                        name="payment"
                        value="UPI"
                        required
                    >

                    UPI

                </label>


                <label class="payment">

                    <input
                        type="radio"
                        name="payment"
                        value="Card"
                    >

                    Debit / Credit Card

                </label>


                <label class="payment">

                    <input
                        type="radio"
                        name="payment"
                        value="Net Banking"
                    >

                    Net Banking

                </label>


                <button
                    type="submit"
                    class="pay"
                >
                    Continue to Payment
                </button>


                <div class="secure">
                    🔒 Secure checkout
                </div>


                <div id="message"></div>

            </section>


            <!-- ORDER SUMMARY -->

            <section class="card">

                <h2>
                    Order Summary
                </h2>


                <div class="summary-item">

                    <span>
                        Service
                    </span>

                    <span id="summaryService">
                        Not selected
                    </span>

                </div>


                <div class="summary-item">

                    <span>
                        Billing
                    </span>

                    <span>
                        Monthly
                    </span>

                </div>


                <div class="summary-item">

                    <span>
                        Subtotal
                    </span>

                    <span>
                        ₹0.00
                    </span>

                </div>


                <div class="summary-item">

                    <span>
                        Tax
                    </span>

                    <span>
                        ₹0.00
                    </span>

                </div>


                <div class="total">

                    <span>
                        Total
                    </span>

                    <span>
                        ₹0.00
                    </span>

                </div>

            </section>

        </div>

    </form>

</div>


<footer>
    © 2026 TSA Web — All Rights Reserved.
</footer>


<script>

const service =
    document.getElementById("service");

const summary =
    document.getElementById("summaryService");

service.addEventListener("change",function(){

    summary.textContent =
        service.value || "Not selected";

});


document
.getElementById("checkoutForm")
.addEventListener("submit",function(event){

    event.preventDefault();

    const message =
        document.getElementById("message");

    message.style.display="block";

    message.textContent =
        "Order details confirmed. Real payment processing requires a payment gateway/backend.";

});

</script>

</body>
</html>
