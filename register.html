<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TSA Web - Create Account</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:#070914;
    color:#fff;
}

/* NAVBAR */

.navbar{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:18px 6%;

    background:rgba(7,9,20,.96);

    border-bottom:1px solid #252b4a;
}

.logo{
    font-size:26px;
    font-weight:900;
    color:#8b5cf6;
}

.logo span{
    color:#38bdf8;
}

.home{
    color:#cbd5e1;
    text-decoration:none;

    padding:10px 16px;

    border:1px solid #334155;

    border-radius:9px;

    transition:.3s;
}

.home:hover{
    color:#38bdf8;
    border-color:#38bdf8;
}

/* REGISTER AREA */

.register-wrapper{
    flex:1;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:50px 20px;

    background:
    radial-gradient(
        circle at 50% 20%,
        rgba(56,189,248,.18),
        transparent 45%
    );
}

.register-card{
    width:100%;
    max-width:470px;

    padding:38px 32px;

    border-radius:20px;

    background:
    linear-gradient(
        145deg,
        #11172b,
        #0b1020
    );

    border:1px solid #27304e;

    box-shadow:
    0 20px 60px
    rgba(0,0,0,.35);
}

.icon{
    width:70px;
    height:70px;

    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:18px;

    font-size:32px;

    background:
    linear-gradient(
        135deg,
        #7c3aed,
        #2563eb
    );
}

.register-card h1{
    text-align:center;

    font-size:32px;

    margin-bottom:10px;
}

.subtitle{
    text-align:center;

    color:#94a3b8;

    line-height:1.6;

    margin-bottom:30px;
}

/* FORM */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;

    margin-bottom:8px;

    color:#cbd5e1;

    font-size:14px;
}

.form-group input{
    width:100%;

    padding:14px 15px;

    border-radius:10px;

    border:1px solid #334155;

    outline:none;

    background:#080d1c;

    color:#fff;

    font-size:15px;

    transition:.3s;
}

.form-group input:focus{
    border-color:#6366f1;

    box-shadow:
    0 0 0 3px
    rgba(99,102,241,.12);
}

/* PASSWORD STRENGTH */

.strength{
    height:5px;

    margin-top:8px;

    border-radius:10px;

    background:#202a47;

    overflow:hidden;
}

.strength-bar{
    width:0%;

    height:100%;

    transition:.3s;
}

/* CHECKBOX */

.terms{
    display:flex;

    align-items:flex-start;

    gap:10px;

    margin:20px 0;

    color:#94a3b8;

    font-size:13px;

    line-height:1.5;
}

.terms input{
    margin-top:3px;
}

.terms a{
    color:#60a5fa;
    text-decoration:none;
}

/* BUTTON */

.register-btn{
    width:100%;

    border:0;

    padding:14px;

    border-radius:10px;

    color:#fff;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(
        135deg,
        #7c3aed,
        #2563eb
    );

    transition:.3s;
}

.register-btn:hover{
    transform:translateY(-2px);

    box-shadow:
    0 10px 25px
    rgba(79,70,229,.3);
}

/* MESSAGE */

#message{
    display:none;

    margin-top:18px;

    padding:12px;

    border-radius:9px;

    text-align:center;

    font-size:14px;

    background:#101a32;

    color:#93c5fd;
}

/* LOGIN */

.login-link{
    text-align:center;

    margin-top:25px;

    color:#94a3b8;

    font-size:14px;
}

.login-link a{
    color:#38bdf8;

    font-weight:bold;

    text-decoration:none;
}

.login-link a:hover{
    text-decoration:underline;
}

/* FOOTER */

footer{
    text-align:center;

    padding:25px;

    color:#64748b;

    background:#050711;

    border-top:1px solid #1c2338;
}

@media(max-width:500px){

    .navbar{
        padding:16px 5%;
    }

    .register-card{
        padding:32px 22px;
    }

    .register-card h1{
        font-size:28px;
    }
}

</style>
</head>

<body>

<!-- NAVBAR -->

<header class="navbar">

    <div class="logo">
        TSA <span>Web</span>
    </div>

    <a href="index.html" class="home">
        ← Home
    </a>

</header>


<!-- REGISTER -->

<main class="register-wrapper">

    <div class="register-card">

        <div class="icon">
            👤
        </div>

        <h1>
            Create Account
        </h1>

        <p class="subtitle">
            Create your TSA Web account
            and manage your hosting services.
        </p>


        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Choose a username"
                    minlength="3"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <div class="strength">
                    <div
                        class="strength-bar"
                        id="strengthBar">
                    </div>
                </div>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <label class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <span>
                    I agree to the
                    <a href="terms.html">
                        Terms & Conditions
                    </a>
                    and
                    <a href="privacy.html">
                        Privacy Policy
                    </a>.
                </span>

            </label>


            <button
                type="submit"
                class="register-btn"
            >
                Create Account
            </button>

        </form>


        <div id="message"></div>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</main>


<footer>

    © 2026 TSA Web — All Rights Reserved.

</footer>


<script>

const form =
    document.getElementById("registerForm");

const password =
    document.getElementById("password");

const confirmPassword =
    document.getElementById("confirmPassword");

const strengthBar =
    document.getElementById("strengthBar");

const message =
    document.getElementById("message");


/* PASSWORD STRENGTH */

password.addEventListener("input", function(){

    const value = password.value;

    let strength = 0;

    if(value.length >= 6)
        strength += 25;

    if(/[A-Z]/.test(value))
        strength += 25;

    if(/[0-9]/.test(value))
        strength += 25;

    if(/[^A-Za-z0-9]/.test(value))
        strength += 25;

    strengthBar.style.width =
        strength + "%";

});


/* REGISTER FORM */

form.addEventListener("submit", function(event){

    event.preventDefault();

    const pass =
        password.value;

    const confirm =
        confirmPassword.value;

    if(pass !== confirm){

        message.style.display = "block";

        message.textContent =
            "Passwords do not match.";

        return;
    }

    message.style.display = "block";

    message.textContent =
        "Account form submitted successfully.";

    /*
      Front-end demo only.

      Real account creation ke liye
      backend + database authentication
      connect karna hoga.
    */

});

</script>

</body>
</html>
