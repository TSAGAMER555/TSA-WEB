<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TSA Web - Payment Success</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:#070914;
    color:#fff;
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 6%;
    background:#080b18;
    border-bottom:1px solid #252b4a;
}

.logo{
    font-size:26px;
    font-weight:900;
    color:#8b5cf6;
}

.logo span{
    color:#38bdf8;
}

.home{
    color:#cbd5e1;
    text-decoration:none;
    padding:10px 16px;
    border:1px solid #334155;
    border-radius:9px;
}

.main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
    background:
    radial-gradient(
        circle at center,
        rgba(34,197,94,.12),
        transparent 45%
    );
}

.card{
    width:100%;
    max-width:550px;
    padding:45px 30px;
    text-align:center;
    border-radius:20px;
    background:linear-gradient(145deg,#11172b,#0b1020);
    border:1px solid #27304e;
}

.check{
    width:85px;
    height:85px;
    margin:0 auto 25px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-size:40px;
    background:#0f2a22;
    border:2px solid #22c55e;
    animation:pop .5s ease;
}

@keyframes pop{
    0%{
        transform:scale(.4);
        opacity:0;
    }

    70%{
        transform:scale(1.1);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

h1{
    font-size:32px;
    margin-bottom:12px;
}

.subtitle{
    color:#94a3b8;
    line-height:1.7;
}

.info{
    margin-top:28px;
    padding:20px;
    text-align:left;
    border-radius:12px;
    background:#080d1c;
    border:1px solid #202a47;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:10px 0;
    border-bottom:1px solid #202a47;
}

.row:last-child{
    border-bottom:0;
}

.label{
    color:#64748b;
}

.value{
    color:#e2e8f0;
    text-align:right;
}

.buttons{
    display:flex;
    gap:12px;
    margin-top:25px;
}

.btn{
    flex:1;
    padding:13px;
    border-radius:9px;
    text-decoration:none;
    font-weight:bold;
}

.primary{
    color:#fff;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
}

.secondary{
    color:#cbd5e1;
    border:1px solid #334155;
}

footer{
    text-align:center;
    padding:28px;
    color:#64748b;
    background:#050711;
    border-top:1px solid #1c2338;
}

@media(max-width:550px){

    .card{
        padding:35px 20px;
    }

    .buttons{
        flex-direction:column;
    }

    .row{
        flex-direction:column;
        gap:4px;
    }

    .value{
        text-align:left;
    }
}
</style>
</head>

<body>

<header class="navbar">

    <div class="logo">
        TSA <span>Web</span>
    </div>

    <a href="dashboard.html" class="home">
        Dashboard
    </a>

</header>


<main class="main">

    <div class="card">

        <div class="check">
            ✓
        </div>

        <h1>
            Payment Successful!
        </h1>

        <p class="subtitle">
            Thank you for choosing TSA Web.
            Your order has been received successfully.
        </p>


        <div class="info">

            <div class="row">

                <span class="label">
                    Order ID
                </span>

                <span class="value">
                    TSA-000001
                </span>

            </div>


            <div class="row">

                <span class="label">
                    Service
                </span>

                <span class="value">
                    Hosting Service
                </span>

            </div>


            <div class="row">

                <span class="label">
                    Amount
                </span>

                <span class="value">
                    ₹0.00
                </span>

            </div>


            <div class="row">

                <span class="label">
                    Status
                </span>

                <span
                    class="value"
                    style="color:#4ade80;"
                >
                    Paid
                </span>

            </div>

        </div>


        <div class="buttons">

            <a
                href="dashboard.html"
                class="btn primary"
            >
                Go to Dashboard
            </a>

            <a
                href="invoice.html"
                class="btn secondary"
            >
                View Invoice
            </a>

        </div>

    </div>

</main>


<footer>
    © 2026 TSA Web — All Rights Reserved.
</footer>

</body>
</html>
