<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TSA Web - Forgot Password</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:#070914;
    color:#fff;
}

.navbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 6%;
    background:#080b18;
    border-bottom:1px solid #252b4a;
}

.logo{
    font-size:26px;
    font-weight:900;
    color:#8b5cf6;
}

.logo span{
    color:#38bdf8;
}

.home{
    color:#cbd5e1;
    text-decoration:none;
    padding:10px 16px;
    border:1px solid #334155;
    border-radius:9px;
}

.home:hover{
    color:#38bdf8;
    border-color:#38bdf8;
}

.wrapper{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:50px 20px;

    background:
    radial-gradient(
        circle at 50% 20%,
        rgba(124,58,237,.22),
        transparent 45%
    );
}

.card{
    width:100%;
    max-width:430px;
    padding:38px 32px;

    text-align:center;

    border-radius:20px;

    background:linear-gradient(
        145deg,
        #11172b,
        #0b1020
    );

    border:1px solid #27304e;

    box-shadow:
    0 20px 60px rgba(0,0,0,.35);
}

.icon{
    width:70px;
    height:70px;

    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:18px;

    font-size:32px;

    background:linear-gradient(
        135deg,
        #7c3aed,
        #2563eb
    );
}

h1{
    font-size:30px;
    margin-bottom:12px;
}

.subtitle{
    color:#94a3b8;
    line-height:1.6;
    margin-bottom:28px;
}

.group{
    text-align:left;
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#cbd5e1;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;

    border-radius:10px;
    border:1px solid #334155;
    outline:none;

    background:#080d1c;
    color:#fff;

    font-size:15px;
}

input:focus{
    border-color:#6366f1;
    box-shadow:
    0 0 0 3px rgba(99,102,241,.12);
}

button{
    width:100%;
    padding:14px;

    border:0;
    border-radius:10px;

    color:#fff;
    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    background:linear-gradient(
        135deg,
        #7c3aed,
        #2563eb
    );

    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
}

#message{
    display:none;
    margin-top:18px;
    padding:13px;
    border-radius:9px;

    background:#101a32;
    color:#93c5fd;

    font-size:14px;
    line-height:1.5;
}

.back{
    display:inline-block;
    margin-top:22px;

    color:#38bdf8;
    text-decoration:none;
    font-size:14px;
}

footer{
    text-align:center;
    padding:25px;

    color:#64748b;

    background:#050711;
    border-top:1px solid #1c2338;
}

@media(max-width:500px){

    .navbar{
        padding:16px 5%;
    }

    .card{
        padding:32px 22px;
    }
}
</style>
</head>

<body>

<header class="navbar">

    <div class="logo">
        TSA <span>Web</span>
    </div>

    <a href="index.html" class="home">
        ← Home
    </a>

</header>


<main class="wrapper">

    <div class="card">

        <div class="icon">
            🔑
        </div>

        <h1>
            Forgot Password?
        </h1>

        <p class="subtitle">
            Apna registered email address enter karein.
            Password reset instructions yahan se request
            ki ja sakti hain.
        </p>


        <form id="forgotForm">

            <div class="group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <button type="submit">
                Send Reset Request
            </button>

        </form>


        <div id="message"></div>


        <a href="login.html" class="back">
            ← Back to Login
        </a>

    </div>

</main>


<footer>
    © 2026 TSA Web — All Rights Reserved.
</footer>


<script>

const form =
    document.getElementById("forgotForm");

const message =
    document.getElementById("message");

form.addEventListener("submit",function(event){

    event.preventDefault();

    message.style.display="block";

    message.textContent =
        "Reset request submitted successfully.";

    form.reset();

});

</script>

</body>
</html>
