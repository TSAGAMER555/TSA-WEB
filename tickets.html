<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TSA Web - Support Tickets</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#070914;
    color:#fff;
    min-height:100vh;
}

.navbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 6%;
    background:#080b18;
    border-bottom:1px solid #252b4a;
}

.logo{
    font-size:26px;
    font-weight:900;
    color:#8b5cf6;
}

.logo span{
    color:#38bdf8;
}

.back{
    color:#cbd5e1;
    text-decoration:none;
    padding:10px 16px;
    border:1px solid #334155;
    border-radius:9px;
}

.back:hover{
    color:#38bdf8;
    border-color:#38bdf8;
}

.container{
    width:92%;
    max-width:1050px;
    margin:45px auto 80px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
}

.header h1{
    font-size:34px;
}

.header p{
    margin-top:7px;
    color:#94a3b8;
}

.new-ticket{
    padding:13px 18px;
    border:0;
    border-radius:9px;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
}

.card{
    padding:25px;
    margin-bottom:20px;
    border-radius:16px;
    background:linear-gradient(145deg,#11172b,#0b1020);
    border:1px solid #27304e;
}

.ticket{
    display:grid;
    grid-template-columns:1fr auto;
    gap:15px;
    padding:20px 0;
    border-bottom:1px solid #202a47;
}

.ticket:last-child{
    border-bottom:0;
}

.ticket h3{
    margin-bottom:7px;
}

.ticket p{
    color:#94a3b8;
    font-size:14px;
}

.ticket-id{
    color:#64748b;
    font-size:12px;
    margin-top:7px;
}

.status{
    height:max-content;
    padding:7px 11px;
    border-radius:20px;
    font-size:12px;
}

.open{
    color:#4ade80;
    background:#0f2a22;
}

.pending{
    color:#facc15;
    background:#2a240e;
}

.closed{
    color:#94a3b8;
    background:#202638;
}

.empty{
    text-align:center;
    padding:45px 20px;
    color:#64748b;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    padding:20px;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.7);
}

.modal-box{
    width:100%;
    max-width:500px;
    padding:30px;
    border-radius:17px;
    background:#10172b;
    border:1px solid #334155;
}

.modal-box h2{
    margin-bottom:22px;
}

.group{
    margin-bottom:17px;
}

.group label{
    display:block;
    margin-bottom:7px;
    color:#cbd5e1;
    font-size:14px;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border-radius:9px;
    border:1px solid #334155;
    outline:none;
    background:#080d1c;
    color:#fff;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.submit,
.cancel{
    flex:1;
    padding:13px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

.submit{
    border:0;
    color:#fff;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
}

.cancel{
    border:1px solid #334155;
    color:#cbd5e1;
    background:transparent;
}

#message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:9px;
    background:#101a32;
    color:#93c5fd;
    text-align:center;
}

footer{
    text-align:center;
    padding:30px;
    color:#64748b;
    background:#050711;
    border-top:1px solid #1c2338;
}

@media(max-width:650px){

    .header{
        align-items:flex-start;
        flex-direction:column;
    }

    .ticket{
        grid-template-columns:1fr;
    }

    .navbar{
        padding:16px 5%;
    }
}
</style>
</head>

<body>

<header class="navbar">

    <div class="logo">
        TSA <span>Web</span>
    </div>

    <a href="dashboard.html" class="back">
        ← Dashboard
    </a>

</header>


<div class="container">

    <div class="header">

        <div>
            <h1>
                Support Tickets
            </h1>

            <p>
                Apne support requests ko manage karein.
            </p>
        </div>

        <button
            class="new-ticket"
            onclick="openModal()"
        >
            + New Ticket
        </button>

    </div>


    <div class="card" id="ticketList">

        <div class="empty">
            🎫 No support tickets yet.
            <br><br>
            New Ticket button se request create karein.
        </div>

    </div>

</div>


<!-- MODAL -->

<div class="modal" id="modal">

    <div class="modal-box">

        <h2>
            Create Support Ticket
        </h2>

        <form id="ticketForm">

            <div class="group">

                <label>
                    Subject
                </label>

                <input
                    id="subject"
                    type="text"
                    placeholder="Enter ticket subject"
                    required
                >

            </div>


            <div class="group">

                <label>
                    Category
                </label>

                <select id="category" required>

                    <option value="">
                        Select category
                    </option>

                    <option>
                        Game Hosting
                    </option>

                    <option>
                        Bot Hosting
                    </option>

                    <option>
                        VPS
                    </option>

                    <option>
                        Billing
                    </option>

                    <option>
                        Technical Support
                    </option>

                    <option>
                        Other
                    </option>

                </select>

            </div>


            <div class="group">

                <label>
                    Message
                </label>

                <textarea
                    id="ticketMessage"
                    placeholder="Describe your problem..."
                    required
                ></textarea>

            </div>


            <div class="buttons">

                <button
                    type="button"
                    class="cancel"
                    onclick="closeModal()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="submit"
                >
                    Create Ticket
                </button>

            </div>

        </form>

        <div id="message"></div>

    </div>

</div>


<footer>

    © 2026 TSA Web — All Rights Reserved.

</footer>


<script>

const modal =
    document.getElementById("modal");

const form =
    document.getElementById("ticketForm");

const ticketList =
    document.getElementById("ticketList");

function openModal(){

    modal.style.display="flex";

}

function closeModal(){

    modal.style.display="none";

}

window.addEventListener("click",function(event){

    if(event.target === modal){
        closeModal();
    }

});


form.addEventListener("submit",function(event){

    event.preventDefault();

    const subject =
        document.getElementById("subject").value;

    const category =
        document.getElementById("category").value;

    const id =
        "TSA-" +
        Math.floor(
            10000 + Math.random() * 90000
        );

    ticketList.innerHTML = `

        <div class="ticket">

            <div>

                <h3>
                    ${subject}
                </h3>

                <p>
                    ${category}
                </p>

                <div class="ticket-id">
                    Ticket ID: ${id}
                </div>

            </div>

            <div class="status open">
                Open
            </div>

        </div>

    `;

    document.getElementById("message").style.display="block";

    document.getElementById("message").textContent =
        "Ticket created successfully!";

    form.reset();

    setTimeout(function(){
        closeModal();
        document.getElementById("message").style.display="none";
    },1200);

});

</script>

</body>
</html>
