<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TSA Web - Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#070914;
    color:#fff;
    min-height:100vh;
}

.navbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 6%;
    background:#080b18;
    border-bottom:1px solid #252b4a;
}

.logo{
    font-size:26px;
    font-weight:900;
    color:#8b5cf6;
}

.logo span{
    color:#38bdf8;
}

.back{
    color:#cbd5e1;
    text-decoration:none;
    padding:10px 16px;
    border:1px solid #334155;
    border-radius:9px;
}

.back:hover{
    color:#38bdf8;
    border-color:#38bdf8;
}

.container{
    width:92%;
    max-width:900px;
    margin:50px auto 80px;
}

.profile-card{
    padding:35px;
    border-radius:20px;
    background:linear-gradient(145deg,#11172b,#0b1020);
    border:1px solid #27304e;
}

.profile-top{
    display:flex;
    align-items:center;
    gap:22px;
    padding-bottom:30px;
    border-bottom:1px solid #27304e;
}

.avatar{
    width:85px;
    height:85px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-size:35px;
    font-weight:bold;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
}

.profile-top h1{
    margin-bottom:7px;
}

.profile-top p{
    color:#94a3b8;
}

.section{
    padding-top:30px;
}

.section h2{
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.field{
    padding:17px;
    border-radius:11px;
    background:#080d1c;
    border:1px solid #202a47;
}

.field label{
    display:block;
    color:#64748b;
    font-size:12px;
    margin-bottom:7px;
}

.field span{
    color:#e2e8f0;
}

input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #334155;
    outline:none;
    background:#080d1c;
    color:#fff;
}

button{
    margin-top:20px;
    padding:13px 20px;
    border:0;
    border-radius:9px;
    color:#fff;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    transform:translateY(-2px);
}

#message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:9px;
    background:#101a32;
    color:#93c5fd;
}

.actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.action{
    padding:12px 17px;
    border-radius:9px;
    border:1px solid #334155;
    color:#cbd5e1;
    text-decoration:none;
}

.action:hover{
    border-color:#6366f1;
    color:#fff;
}

footer{
    text-align:center;
    padding:30px;
    color:#64748b;
    background:#050711;
    border-top:1px solid #1c2338;
}

@media(max-width:650px){

    .profile-top{
        flex-direction:column;
        text-align:center;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .profile-card{
        padding:25px 20px;
    }
}
</style>
</head>

<body>

<header class="navbar">

    <div class="logo">
        TSA <span>Web</span>
    </div>

    <a href="dashboard.html" class="back">
        ← Dashboard
    </a>

</header>


<div class="container">

    <div class="profile-card">

        <div class="profile-top">

            <div class="avatar">
                T
            </div>

            <div>
                <h1>
                    My Profile
                </h1>

                <p>
                    Manage your TSA Web account
                </p>
            </div>

        </div>


        <section class="section">

            <h2>
                Account Information
            </h2>

            <form id="profileForm">

                <div class="grid">

                    <div class="field">

                        <label>
                            FULL NAME
                        </label>

                        <input
                            type="text"
                            id="name"
                            value="TSA Web User"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            USERNAME
                        </label>

                        <input
                            type="text"
                            id="username"
                            value="tsauser"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            EMAIL
                        </label>

                        <input
                            type="email"
                            id="email"
                            value="user@example.com"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            PHONE
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                        >

                    </div>

                </div>


                <button type="submit">
                    Save Changes
                </button>

            </form>

            <div id="message">
                Profile updated successfully.
            </div>

        </section>


        <section class="section">

            <h2>
                Quick Links
            </h2>

            <div class="actions">

                <a
                    href="dashboard.html"
                    class="action"
                >
                    🏠 Dashboard
                </a>

                <a
                    href="pricing.html"
                    class="action"
                >
                    🛒 Buy Hosting
                </a>

                <a
                    href="support.html"
                    class="action"
                >
                    🎫 Support
                </a>

                <a
                    href="docs.html"
                    class="action"
                >
                    📚 Documentation
                </a>

            </div>

        </section>

    </div>

</div>


<footer>

    © 2026 TSA Web — All Rights Reserved.

</footer>


<script>

document
.getElementById("profileForm")
.addEventListener("submit",function(event){

    event.preventDefault();

    document
    .getElementById("message")
    .style.display="block";

});

</script>

</body>
</html>
