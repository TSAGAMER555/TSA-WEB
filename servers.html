<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TSA Web - My Servers</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#070914;
    color:#fff;
    min-height:100vh;
}

.navbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 6%;
    background:#080b18;
    border-bottom:1px solid #252b4a;
}

.logo{
    font-size:26px;
    font-weight:900;
    color:#8b5cf6;
}

.logo span{
    color:#38bdf8;
}

.back{
    color:#cbd5e1;
    text-decoration:none;
    padding:10px 16px;
    border:1px solid #334155;
    border-radius:9px;
}

.back:hover{
    color:#38bdf8;
    border-color:#38bdf8;
}

.container{
    width:92%;
    max-width:1100px;
    margin:45px auto 80px;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:30px;
}

.header h1{
    font-size:35px;
    margin-bottom:8px;
}

.header p{
    color:#94a3b8;
}

.add{
    padding:13px 18px;
    border:0;
    border-radius:9px;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
}

.servers{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.server{
    padding:25px;
    border-radius:17px;
    background:linear-gradient(145deg,#11172b,#0b1020);
    border:1px solid #27304e;
    transition:.3s;
}

.server:hover{
    transform:translateY(-4px);
    border-color:#6366f1;
}

.server-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.server-name{
    font-size:21px;
    font-weight:bold;
}

.server-type{
    color:#64748b;
    font-size:13px;
    margin-top:5px;
}

.status{
    padding:7px 10px;
    border-radius:20px;
    font-size:12px;
}

.online{
    background:#0f2a22;
    color:#4ade80;
}

.offline{
    background:#202638;
    color:#94a3b8;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
}

.stat{
    padding:13px;
    border-radius:9px;
    background:#080d1c;
    border:1px solid #202a47;
}

.stat small{
    display:block;
    color:#64748b;
    margin-bottom:5px;
}

.stat strong{
    color:#cbd5e1;
}

.actions{
    display:flex;
    gap:10px;
}

.action{
    flex:1;
    padding:11px;
    text-align:center;
    border-radius:8px;
    border:1px solid #334155;
    color:#cbd5e1;
    text-decoration:none;
    background:#0a0f20;
    cursor:pointer;
}

.action:hover{
    border-color:#6366f1;
    color:#fff;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:#64748b;
    border:1px dashed #334155;
    border-radius:16px;
}

.empty a{
    display:inline-block;
    margin-top:18px;
    padding:12px 18px;
    border-radius:9px;
    color:#fff;
    text-decoration:none;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
}

footer{
    text-align:center;
    padding:30px;
    color:#64748b;
    background:#050711;
    border-top:1px solid #1c2338;
}

@media(max-width:750px){

    .header{
        align-items:flex-start;
        flex-direction:column;
    }

    .servers{
        grid-template-columns:1fr;
    }

    .navbar{
        padding:16px 5%;
    }
}
</style>
</head>

<body>

<header class="navbar">

    <div class="logo">
        TSA <span>Web</span>
    </div>

    <a href="dashboard.html" class="back">
        ← Dashboard
    </a>

</header>


<div class="container">

    <div class="header">

        <div>

            <h1>
                My Servers
            </h1>

            <p>
                Apne hosting servers ko manage karein.
            </p>

        </div>

        <button
            class="add"
            onclick="location.href='pricing.html'"
        >
            + Add Server
        </button>

    </div>


    <div class="servers">

        <div class="empty">

            🖥️

            <br><br>

            <strong>
                No servers found
            </strong>

            <br><br>

            Abhi aapke account mein koi active server nahi hai.

            <br>

            <a href="pricing.html">
                Purchase Hosting →
            </a>

        </div>

    </div>

</div>


<footer>

    © 2026 TSA Web — All Rights Reserved.

</footer>

</body>
</html>
